name: Release

# Tags main and publishes a GitHub release on every push, bumping the
# version from the Conventional Commit messages since the last tag:
#   feat!: / fix!: / BREAKING CHANGE:  -> major
#   feat:                              -> minor
#   fix: / perf:                       -> patch
#   anything else (chore/docs/refactor/ci/...) -> no release
# Tags are plain semver without a "v" prefix (1.0.0, 1.1.0, ...).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ]; then
            range="$last..HEAD"
          else
            last="0.0.0"
            range="HEAD"
          fi

          subjects=$(git log --no-merges --format='%s' "$range")
          bodies=$(git log --no-merges --format='%b' "$range")

          if printf '%s\n' "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
            || printf '%s\n' "$bodies" | grep -qE '^BREAKING[ -]CHANGE:'; then
            bump=major
          elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
            bump=minor
          elif printf '%s\n' "$subjects" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
            bump=patch
          else
            echo "No feat/fix/perf/breaking commits since $last — nothing to release."
            exit 0
          fi

          IFS=. read -r major minor patch <<< "$last"
          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac

          echo "$last -> $next ($bump)"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.version.outputs.next
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "$NEXT" --target "$GITHUB_SHA" --title "$NEXT" --generate-notes
