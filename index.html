<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#002b36" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Odmandakh OS</title>
    <meta name="description" content="Odmandakh's personal portfolio, presented as a simple macOS-inspired desktop." />
    <meta property="og:title" content="Odmandakh OS" />
    <meta property="og:description" content="Odmandakh's personal portfolio, presented as a simple macOS-inspired desktop." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body {
        background: #002b36;
        margin: 0;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #586e75;
      }
      #boot-loader .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #2aa19833;
        border-top-color: #2aa198;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader">
        <div class="spinner"></div>
        <span>Loading Odmandakh OS…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
